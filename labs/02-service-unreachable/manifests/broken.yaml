apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: incident-02}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: incident-02}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: wrong-http}]

---
apiVersion: v1
kind: Pod
metadata:
  name: web-client
  namespace: incident-02
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]

